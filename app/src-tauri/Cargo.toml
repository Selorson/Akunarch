[package]
name = "akunarch"
version = "2.0.0"
description = "Akunarch — Đại Xưởng Kiến Tạo Vũ Trụ 3D, Sa Bàn Cơ Khí, Thế Giới Mở, Visual Novel & Điện Ảnh"
edition = "2021"
rust-version = "1.85"

[lib]
name = "akunarch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = "9"
base64 = "0.22"
urlencoding = "2.1"

# Kế hoạch VRAM v2 · B1: đọc PDH `GPU Process Memory` + cây tiến trình (bindings thuần, không runtime)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
